[package]
name = "ai-note-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AI Note 데스크톱 앱 Rust 코어 — 볼트·git·에이전트·리뷰·초대장 모듈"

[[example]]
name = "codec_gen"
required-features = ["test-vectors"]

[features]
test-vectors = []

[dependencies]
hex = "0.4"
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# 로컬 영속 상태 (M2 — 변경 세트 상태·PR 메타·ETag 캐시)
# F14: 토큰은 절대 여기 두지 않는다(키체인 전용)
rusqlite = { version = "0.32", features = ["bundled"] }

# 전문 검색 색인 (M2 — S3 채택: 내장 Ngram 빅그램)
tantivy = "0.22"

# git 계층 (M1 — S2 증명 기반)
git2 = "0.20"

# github REST (M1)
octocrab = "0.44"
tokio.workspace = true

# 토큰 보관 — OS 키체인 (M1, F14)
keyring = { version = "3", features = ["apple-native", "windows-native"] }

http-body-util = "0.1"

# invite 코덱 (S4)
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
zeroize = "1"
minisign-verify = "0.3.0"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

# libgit2 HTTPS는 macOS에서도 OpenSSL 동적 링크가 기본(1.9부터 SecureTransport
# 제거) — 빌드기계의 brew/system libssl.3.dylib에 붙어 배포기계에서 launch
# 즉시 SIGABRT(공개 릴리스 실측). 정적 벤더링으로 바이너리 자기완결 확보.
# Windows는 libgit2가 WinHTTP 백엔드라 제외.
# (주의: [dependencies] 테이블 중간에 두면 이후 의존성이 target 테이블로
#  흡수되어 Windows 빌드가 깨진다 — 반드시 테이블 선언 뒤에 배치)
[target.'cfg(not(target_os = "windows"))'.dependencies]
libgit2-sys = { version = "0.18", features = ["vendored-openssl"] }
