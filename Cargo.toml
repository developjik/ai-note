[workspace]
resolver = "2"
members = [
    "crates/ai-note-core",
    "crates/spike-git2",
    "crates/spike-tantivy-ko",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[profile.release]
lto = true
codegen-units = 1
