[package]
name = "ai-note-desktop"
version = "0.1.0"
edition = "2021"
description = "AI Note 데스크톱 셸 — Tauri v2"

[lib]
name = "ai_note_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ai-note-core = { path = "../../../crates/ai-note-core" }
