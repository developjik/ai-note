name: 릴리스 게시 (무서명 v1 + minisign)

# M5 — 태그(v*) 푸시 시 dmg/NSIS + checksums + minisign 서명 게시.
# 서명 비밀키는 저장소 시크릿 MINISIGN_SECRET_KEY(앱 업데이터 검증용 —
# 공개키는 apps/download-page/index.html 자리표시자를 교체해 게시).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "crates -> target\ncrates"
      - name: 프런트 빌드
        run: pnpm install --frozen-lockfile && pnpm -C apps/desktop build
      - name: 번들(무서명 dmg/NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          # 무서명 v1(Q1) — 서명 시크릿 없음: 경고 우회는 다운로드 페이지 안내
          APPLE_CERTIFICATE: ""
          # Release 게시에 필수 — 누락 시 "GITHUB_TOKEN is required"로 실패(실측)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AI Note ${{ github.ref_name }}"
          releaseBody: |
            ## 설치 안내
            처음 설치 시 운영 체제가 "확인되지 않은 개발자" 경고를 보여줄 수 있어요.
            macOS: 시스템 설정 → 개인 정보 보호 및 보안 → 그래도 허용 (설치 때 1회)
            Windows: 추가 정보 → 실행 (설치 때 1회)
            자세한 안내와 진위 검증(공개키)은 다운로드 페이지를 참고해 주세요.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      # 체크섬+서명은 후속 잡에서 모든 플랫폼 자산 대상 1회 수행

  checksums:
    needs: [release]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 릴리스 자산 전수 checksums(dmg+exe) + minisign 서명
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          mkdir -p assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
          python3 - <<'PY'
          import hashlib, glob, os
          lines = []
          for f in sorted(glob.glob("*.dmg") + glob.glob("*.exe") + glob.glob("*.msi") + glob.glob("*.app.tar.gz")):
              h = hashlib.sha256(open(f,'rb').read()).hexdigest()
              lines.append(f"{h}  {os.path.basename(f)}")
          open("checksums.txt","w").write("\n".join(lines)+"\n")
          print(open("checksums.txt").read())
          PY
          if [ -n "${{ secrets.MINISIGN_SECRET_KEY }}" ]; then
            printf '%s' "${{ secrets.MINISIGN_SECRET_KEY }}" > /tmp/ms.key
            brew install minisign || true
            # 빈 패스프레이즈 키도 -S가 프롬프트를 열므로 stdin으로 공급해야
            # 한다 — Actions run 스텝은 stdin이 닫혀 있어 직접 실행 시 실패.
            printf '\n' | minisign -S -s /tmp/ms.key -m checksums.txt -x checksums.txt.minisig
            rm /tmp/ms.key
            gh release upload "$TAG" checksums.txt checksums.txt.minisig --clobber
          else
            echo "MINISIGN_SECRET_KEY 미설정 — checksums만 게시(서명 없음)"
            gh release upload "$TAG" checksums.txt --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  placeholder-guard:
    needs: [checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 다운로드 페이지 자리표시자 잔존 검사
        run: |
          ! grep -rq "MINISIGN_PUBKEY_PLACEHOLDER" apps/download-page/index.html apps/desktop/src-tauri/src/lib.rs || {
            echo "공개키 자리표시자가 아직 교체되지 않았어요 — 릴리스 전 필수(페이지+앱 상수 양쪽)"; exit 1; }

# 최초 push 등록 누락 보완 — 파일 재push로 워크플로 등록
